[project]
name = "tradingcartel"
version = "0.1.0"
description = "LLM agents trading on a simulated stock market, for studying collusion. Every message goes through one event queue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openrouter]==2.51.0",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.414",  # [nodejs]: Node comes locked from PyPI, not downloaded at run time
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[build-system]
requires = ["uv_build==0.12.19"]
build-backend = "uv_build"

[tool.uv]
# Supply-chain policy: resolve only releases uploaded before this date, at least three weeks before
# they were added (2026-10-19). Direct dependencies are pinned with ==, and uv.lock pins the rest.
# To upgrade: move this date forward (keeping it >= 3 weeks in the past), then update the pins.
exclude-newer = "2026-09-28T00:00:00Z"
# uv.lock is in format revision 5, which uv writes from 0.12.22 on; an older uv rewrites it as
# revision 3. (uv itself can't meet the three-week rule above: 0.12.22 came out 2026-10-02.)
required-version = ">=0.12.22"

[tool.uv.build-backend]
module-root = ""  # the package lives in ./tradingcartel, no src/ folder

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
include = ["tradingcartel"]  # not tests/: they read subclass fields off plain Messages, fine at runtime
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
# Copies of llm-toolbox tools and the module they import, kept identical to their originals.
extend-exclude = [
    "lib",
    "bin/apply-edits",
    "bin/bgrun",
    "bin/edit-script-gate",
    "bin/openrouter-credits",
    "bin/safeps",
    "bin/waitone",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
