[project]
name = "zerocommcartel"
version = "0.1.0"
description = "Collusion emerges through shared agent use, without communication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openrouter]==2.53.0",
    "pydantic==2.13.5",
]

[project.scripts]
zcc = "zerocommcartel.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.14"]  # uv's bundled backend, so no download
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pyright[nodejs]==1.1.414",  # [nodejs]: Node comes locked from PyPI, not downloaded at run time
    "pytest==9.1.1",
    "reuse==6.2.0",
    "ruff==0.16.9",
]
# bin/build-paper: the Typst compiler and the figures' plotting
paper = [
    "matplotlib==3.11.2",
    "typst==0.15.0",
]

[tool.uv]
default-groups = ["dev", "paper"]
# Supply-chain policy: resolve only releases uploaded before this date, at least three weeks before
# they were added (2026-10-19). Direct dependencies are pinned with ==, and uv.lock pins the rest.
# To upgrade: move this date forward (keeping it >= 3 weeks in the past), then update the pins.
exclude-newer = "2026-09-28T00:00:00Z"
# A release that fixes an open CVE is exempt: give that package its own date just past the release,
# and note it here. pydantic-ai-slim 2.53.0 (2026-10-02) fixes GHSA-6fqq-452j-qhrp and
# GHSA-v36g-jcw9-x7cw, and pins pydantic-graph to the same version. Approved 2026-10-22; both meet
# the rule on their own from 2026-10-23.
exclude-newer-package = { pydantic-ai-slim = "2026-10-02T04:00:00Z", pydantic-graph = "2026-10-02T04:00:00Z" }
# uv.lock is in format revision 5, which uv writes from 0.12.22 on; an older uv rewrites it as
# revision 3. (uv itself can't meet the three-week rule above: 0.12.22 came out 2026-10-02.)
required-version = ">=0.12.22"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the paper/ package, which isn't installed
addopts = "-q"

[tool.pyright]
include = ["zerocommcartel", "paper"]  # not tests/ or pilot/: tests poke at plain dicts, load pilot/ by path
exclude = ["**/prototype_*.py"]  # throwaway prototypes, which never reach main
typeCheckingMode = "standard"
pythonVersion = "3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
# Copies of llm-toolbox tools and the module they import, kept identical to their originals.
# REUSE.toml's table of llm-toolbox copies lists the same paths, but for session-digest
# (tests/test_toolbox_copies.py).
extend-exclude = [
    "lib",
    "bin/apply-edits",
    "bin/bgrun",
    "bin/claude-fresh",
    "bin/edit-script-gate",
    "bin/issue-todo",
    "bin/openrouter-credits",
    "bin/paper",
    "bin/rewrap",
    "bin/safeps",
    "bin/session-digest",
    "bin/waitone",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The issue #26 pilot, copied as it was written before the sprint: long prompt strings, and lambdas that are
# called in the same loop pass that makes them.
"pilot/*" = ["E501"]
"pilot/analyze.py" = ["E731", "B023"]
"pilot/bench.py" = ["B023"]
