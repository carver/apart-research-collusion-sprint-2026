# Lock check, lint, format check, license check, tests and pyright on every push to main and every
# pull request.
# The tests make no model calls and need no secrets. The pilot job fails when pilot/, its logs or
# its tests differ from the tag pilot-frozen: they are the pre-sprint prior work (README).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run reuse lint
      - run: uv run pytest
      - run: uv run pyright

  pilot-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the history and tags, so pilot-frozen is there to compare with
      - name: The pilot matches the tag pilot-frozen
        run: git diff --exit-code --stat pilot-frozen HEAD -- pilot logs/pilot 'tests/test_pilot_*'
