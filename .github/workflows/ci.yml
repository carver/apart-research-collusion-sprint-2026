# Lint, format check, tests and type check on every push to main and every pull request.
# The tests use PydanticAI's TestModel, so they make no API calls and need no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
      - run: uv run pyright
        env:
          PYRIGHT_PYTHON_IGNORE_WARNINGS: "1"  # don't ask PyPI for a newer pyright on every run
