# Lock check, lint and format check on every push to main and every pull request. The repo
# holds only shared tools for now; add back `uv run pytest` and `uv run pyright` with code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
